],["じりりり","目覚まし時計のベルが鳴り続ける。"],["うぃーん","機械のモーターが回り始めた。"],["ぶーん","扇風機から低く続く音が聞こえる。"],["がたんごとん","電車が線路のつなぎ目をこえて進む。"],["ききーっ","自転車が急ブレーキをかけた。"],["ぷっぷー","車がクラクションを鳴らした。"],["ぴーぽーぴーぽー","救急車がサイレンを鳴らして走る。"]]},{"name":"落ちる・ぶつかる","a":[["ぽとり","枝から木の実が一つ静かに落ちた。"],["どさっ","重い米の袋を地面に下ろした。"],["ばさっ","束ねた新聞が広がりながら床に落ちた。"],["ぱたん","読み終えた本の表紙を閉じた。"],["がしゃん","金属のなべとふたが落ちてぶつかった。"],["ぱりん","薄いガラスのコップが割れた。"],["ぱきっ","かわいた小枝を指で折った。"],["ぽきん","細いえんぴつが二つに折れた。"],["ばきばき","太い枝が何本も続けて折れる。"],["ぼきっ","硬い棒が大きな力で折れた。"],["ぐしゃっ","紙の箱を手のひらで押しつぶした。"],["ばらばら","つないだブロックが一つずつに分かれた。"],["どしん","大きな荷物が地面に重く落ちた。"],["ごつん","頭をうっかり柱にぶつけた。"],["こつん","小石の先がガラスに軽く当たった。"]]},{"name":"数とならび方","a":[["ぎっしり","本だなにすき間なく本が詰まっている。"],["びっしり","小さな文字が紙いっぱいに書いてある。"],["みっちり","箱の中に粘土がすき間なく詰まっている。"],["ぎゅうぎゅう","電車の中は人が押し合うほど混んでいる。"],["すかすか","箱の中はすき間が多くて中身が少ない。"],["がらん","広い体育館にだれもいない。"],["ぽつん","広い野原に木が一本だけ立っている。"],["ちらほら","春の公園で花がところどころに咲き始めた。"],["ぽつりぽつり","広い平原に家が一軒ずつ離れて建っている。"],["ぞろぞろ","遠足の子どもたちが列を作って歩く。"],["うじゃうじゃ","石の下に小さな虫がたくさん集まって動く。"],["うようよ","池の中をたくさんのおたまじゃくしが泳ぎ回る。"],["どっさり","畑でさつまいもが山ほどとれた。"],["こんもり","お茶わんにご飯を丸い山の形に盛る。"],["ずらり","運動場に二十台の一輪車が横一列に並ぶ。"]]}];
const all=groups.flatMap((g,i)=>g.a.map(([word,scene])=>({word,scene,cat:i})));
const app=document.querySelector('#app');let mode='solo',cat=-1,count='10',queue=[],idx=0,errors=[],answered=false,timer=null,search='',bookCat=-1;
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(c){return c<0?all:all.filter(x=>x.cat===c)}
function options(c){return '<option value="-1">すべての場面</option>'+groups.map((g,i)=>'<option value="'+i+'" '+(c===i?'selected':'')+'>'+g.name+'</option>').join('')}
function btn(id,label,cls=''){return '<button id="'+id+'" class="'+cls+'">'+label+'</button>'}
function by(id){return document.getElementById(id)}
function on(id,fn){by(id).onclick=fn}
function cancel(){clearTimeout(timer);timer=null}
let classFormat='word';
function home(){cancel();app.innerHTML='<section class="cover"><p>ことばの図鑑　／　全300語</p><h1><em>オノマトペ</em>ずかん</h1><div class="mascot" aria-hidden="true"><i class="tail"></i><i class="bird"><i class="wing"></i></i><i class="spark">✦</i></div><p>音や ようすに ぴったりの ことばを 見つけよう。</p></section><nav class="tabs" aria-label="学習モード">'+[['solo','ひとりで学習'],['class','みんなで学習'],['book','ことば図鑑']].map(([v,t])=>'<button data-mode="'+v+'" aria-pressed="'+(mode===v)+'">'+t+'</button>').join('')+'</nav><section class="panel" id="panel"></section>';document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;home()});const p=by('panel');if(mode==='book'){p.innerHTML='<label>ことばをさがす<input id="search" type="search" placeholder="例　わくわく、遠足"></label><label>場面<select id="bc">'+options(bookCat)+'</select></label><p id="hits" aria-live="polite"></p><div class="cards" id="cards"></div>';by('search').value=search;by('search').oninput=e=>{search=e.target.value;cards()};by('bc').onchange=e=>{bookCat=+e.target.value;cards()};cards();return}p.innerHTML='<h2>'+ (mode==='solo'?'場面を読んで、4つから選ぼう':'みんなで考えよう')+'</h2><p>'+(mode==='solo'?'答え合わせをしたら、次の問題へ進もう。':classFormat==='scene'?'ことばを見て、思いついた場面を話してみよう。':'「答えを見る」を押すと、お手本のことばが2秒間出るよ。')+'</p>'+(mode==='class'?'<label>問題の種類<select id="format"><option value="word">場面からオノマトペを考える</option><option value="scene">オノマトペから場面を考える</option></select></label>':'')+'<div class="row"><label>場面<select id="cat">'+options(cat)+'</select></label><label>問題の数<select id="count"></select></label></div>'+btn('start','クイズをはじめる →','primary start');if(mode==='class'){const f=by('format');f.value=classFormat;f.onchange=()=>{classFormat=f.value;home();by('format').focus()}}function counts(){const n=pool(cat).length;const opts=[...['10','20','50','100','200'].filter(size=>Number(size)<=n),'all'];if(!opts.includes(count))count='all';by('count').innerHTML=opts.map(v=>'<option value="'+v+'">'+(v==='all'?'全部（'+n+'問）':v+'問')+'</option>').join('');by('count').value=count}counts();by('cat').onchange=e=>{cat=+e.target.value;counts()};by('count').onchange=e=>count=e.target.value;on('start',()=>start(shuffle(pool(cat)).slice(0,count==='all'?undefined:+count)))}
function norm(s){return s.trim().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96))}
function cards(){let a=pool(bookCat).filter(x=>norm(x.word+x.scene).includes(norm(search)));by('hits').textContent=a.length?a.length+'語':'見つかりませんでした。別のことばで探してね。';by('cards').innerHTML=a.map(x=>'<article class="entry"><small>'+groups[x.cat].name+'</small><br><b>'+x.word+'</b><p>'+x.scene+'</p></article>').join('')}
function start(a){cancel();queue=a;idx=0;errors=[];question();window.scrollTo(0,0)}
function question(){answered=false;const q=queue[idx];const askScene=mode==='class'&&classFormat==='scene';app.innerHTML='<section class="panel quiz '+(askScene?'word-first':'')+'"><h1 class="quiz-title">'+(askScene?'どんなときに使うかな？':'ぴったりのことばは？')+'</h1><p class="lesson-mode">'+(mode==='solo'?'ひとりで学習':'みんなで学習')+'</p><div class="statusline"><b>第 '+(idx+1)+' 問 ／ '+queue.length+' 問</b><progress aria-label="問題の進みぐあい" max="'+queue.length+'" value="'+(idx+1)+'"></progress></div><div class="play-layout"><div class="play-field"><p class="meta">'+(askScene?'このことばを使う場面を話してみよう':groups[q.cat].name)+'</p><h2 class="prompt">'+(askScene?q.word:q.scene)+'</h2></div><div class="play-actions"><div id="answers"></div><div id="result" aria-live="polite"></div></div></div></section>';if(askScene){
  by('answers').innerHTML=btn('example','場面の例を見る','primary start');
  on('example',()=>{
    if(answered)return;
    answered=true;
    by('answers').hidden=true;
    by('result').innerHTML='<p><b>たとえば、こんな場面</b></p><p class="prompt">'+q.scene+'</p>'+btn('next',idx+1===queue.length?'学習をおわる':'次の問題へ →','primary');
    on('next',next);
    by('next').focus();
  });
  return;
}
if(mode==='class'){by('answers').innerHTML=btn('show','答えを見る','primary start');on('show',()=>{if(answered)return;answered=true;by('answers').hidden=true;by('result').innerHTML='<p>お手本のことば</p><h2 class="big">'+q.word+'</h2>';timer=setTimeout(next,2000)});return}
const domains=[0,0,1,2,2,3,3,4,4,5,6,6,6,7,7,8,9,9,10,11];let distractors=shuffle(all.filter(x=>domains[x.cat]!==domains[q.cat]&&!q.scene.includes(x.word)));let choices=[q];for(const x of distractors){if(choices.every(y=>domains[y.cat]!==domains[x.cat]))choices.push(x);if(choices.length===4)break}const a=shuffle(choices);by('answers').className='grid';a.forEach(x=>{let b=document.createElement('button');b.textContent=x.word;by('answers').append(b);b.onclick=()=>{if(answered)return;answered=true;const ok=x===q;if(!ok)errors.push(q);for(const el of by('answers').children){el.disabled=true;if(el.textContent===q.word)el.classList.add('good')}if(!ok)b.classList.add('miss');by('result').innerHTML='<p class="feedback">'+(ok?'正解！　':'この場面の答えは「')+q.word+(ok?'':'」')+'</p>'+btn('next',idx+1===queue.length?'結果を見る':'次の問題へ →','primary');on('next',next);by('next').focus()}})}
function next(){cancel();if(++idx<queue.length){question();return}app.innerHTML='<section class="panel"><h2 class="result-title">学習がおわったよ！</h2><p class="big">'+(mode==='solo'?(queue.length-errors.length)+' / '+queue.length+' 問正解':queue.length+' 問クリア')+'</p><div class="options">'+(errors.length?btn('retry','まちがえた問題に挑戦','primary'):'')+btn('again','トップへ戻る')+'</div><div id="review"></div></section>';on('again',home);if(errors.length){by('review').innerHTML='<h3>ふりかえり</h3>'+errors.map(x=>'<p><b>'+x.word+'</b>　'+x.scene+'</p>').join('');on('retry',()=>start(shuffle(errors)))}}
on('home',home);home();
</script></html>
